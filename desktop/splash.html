<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Magen Security System</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* The logo has solid white shapes (shield highlights + the "SECURITY"
     subtitle under the wordmark) drawn to sit on a dark background -- on
     a plain white page those would vanish. This navy card is sized just
     to the logo so the rest of the splash can be plain white as
     requested, while the logo itself still renders correctly. */
  .logo-card {
    padding: 26px 34px;
    border-radius: 18px;
    background: #003770;
    box-shadow: 0 8px 28px rgba(0, 55, 112, 0.18);
    opacity: 0;
    transform: scale(0.8) translateY(6px);
    animation:
      logo-in 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards,
      logo-glow 2.6s ease-in-out 700ms infinite;
  }

  .logo {
    display: block;
    width: 250px;
  }

  @keyframes logo-in {
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  @keyframes logo-glow {
    0%, 100% { box-shadow: 0 8px 28px rgba(0, 55, 112, 0.18), 0 0 0 rgba(9, 170, 76, 0); }
    50%      { box-shadow: 0 8px 28px rgba(0, 55, 112, 0.18), 0 0 22px rgba(9, 170, 76, 0.55); }
  }

  /* Indeterminate loading bar -- fades in after the logo has landed. */
  .bar-track {
    width: 170px;
    height: 3px;
    border-radius: 2px;
    background: rgba(0, 55, 112, 0.14);
    overflow: hidden;
    opacity: 0;
    animation: text-fade-in 400ms ease-out 650ms forwards;
  }

  .bar-fill {
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: #09aa4c;
    animation: bar-slide 1.15s ease-in-out infinite;
  }

  @keyframes text-fade-in {
    to { opacity: 1; }
  }

  @keyframes bar-slide {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(340%); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-card">
      <img class="logo" src="./assets/magen-security-logo.svg" alt="Magen Security" />
    </div>
    <div class="bar-track"><div class="bar-fill"></div></div>
  </div>
</body>
</html>
