<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Magen Security System</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #003770;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  /* Logo pops in with a soft overshoot, then keeps a slow, gentle glow
     pulse for as long as the splash stays up. */
  .logo {
    width: 300px;
    opacity: 0;
    transform: scale(0.8) translateY(6px);
    animation:
      logo-in 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards,
      logo-glow 2.6s ease-in-out 700ms infinite;
  }

  @keyframes logo-in {
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  @keyframes logo-glow {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(9, 170, 76, 0)); }
    50%      { filter: drop-shadow(0 0 14px rgba(9, 170, 76, 0.55)); }
  }

  /* Indeterminate loading bar -- fades in after the logo has landed. */
  .bar-track {
    width: 170px;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
    opacity: 0;
    animation: bar-fade-in 400ms ease-out 550ms forwards;
  }

  .bar-fill {
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: #09aa4c;
    animation: bar-slide 1.15s ease-in-out infinite;
  }

  @keyframes bar-fade-in {
    to { opacity: 1; }
  }

  @keyframes bar-slide {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(340%); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./assets/magen-security-logo.svg" alt="Magen Security" />
    <div class="bar-track"><div class="bar-fill"></div></div>
  </div>
</body>
</html>
