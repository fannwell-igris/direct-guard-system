<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Magen Security System</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #003770;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .name {
    color: #ffffff;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.06em;
    text-align: center;
    text-transform: uppercase;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #09aa4c;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="name">Magen Security System</div>
  </div>
</body>
</html>
